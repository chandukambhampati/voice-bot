[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mission8-agent-evals"
version = "0.1.0"
description = "Mission 8: real LangChain and LangGraph agents with evals and guardrails"
requires-python = ">=3.12"
dependencies = [
    "soundfile>=0.12.1",
    "fastapi>=0.136.1",
    "langchain>=1.2.14,<2.0.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.17,<2.0.0",
    "langchain-openai>=1.1.12,<2.0.0",
    "langgraph>=1.1.6,<2.0.0",
    "langsmith>=0.3.0,<1.0.0",
    "uvicorn>=0.47.0",
    "websockets>=16.0",
]

[tool.uv]
package = false
